const ExportModal = ({ isOpen, onClose, defaultContext, masterStations, submittedOnly = true }) => {
const [station, setStation] = useState("");
const [year, setYear] = useState("");
const [crop, setCrop] = useState("");
const [variety, setVariety] = useState("");
const [purpose, setPurpose] = useState("");
const [season, setSeason] = useState("");
const stationList = getSortedStationNames(masterStations || {});
const selectedStations = station === 'ALL' ? stationList : (station ? [station] : []);
const stationVarieties = selectedStations.flatMap(selectedStation => Object.values(masterStations[selectedStation]?.crops || {}).flat());
const yearList = [...new Set(stationVarieties.map(v => typeof v === 'string' ? 2024 : v.year))].sort((a, b) => b - a);
const selectedYears = year === 'ALL' ? yearList.map(String) : (year ? [String(year)] : []);
const cropList = selectedStations.length && selectedYears.length ? [...new Set(selectedStations.flatMap(selectedStation => Object.keys(masterStations[selectedStation]?.crops || {}).filter(c => (masterStations[selectedStation]?.crops[c] || []).some(v => typeof v === 'string' || selectedYears.includes(String(v.year))))))].sort() : [];
const varietyList = selectedStations.length && selectedYears.length && crop ? selectedStations.flatMap(selectedStation => (masterStations[selectedStation]?.crops[crop] || []).filter(v => typeof v === 'string' || selectedYears.includes(String(v.year)))) : [];
const purposeList = variety ? [...new Set(varietyList.filter(v => typeof v !== 'string' && (variety === 'ALL' || v.name === variety)).map(v => v.purpose))] : [];
const seasonList = purpose ? [...new Set(varietyList.filter(v => typeof v !== 'string' && (variety === 'ALL' || v.name === variety) && (purpose === 'ALL' || v.purpose === purpose)).map(v => v.season))] : [];
useEffect(() => { if (isOpen) { const context = defaultContext || {}; setStation(context.station || ""); setYear(context.year ? String(context.year) : ""); setCrop(context.crop || ""); setVariety(context.variety || ""); setPurpose(context.purpose || ""); setSeason(context.season || ""); } }, [isOpen, defaultContext]);
useEffect(() => {
if (!station || !yearList.includes(Number(year)) && year !== 'ALL') { setYear(""); setCrop(""); setVariety(""); setPurpose(""); setSeason(""); return; }
if (!cropList.includes(crop)) { setCrop(""); setVariety(""); setPurpose(""); setSeason(""); }
}, [station, yearList.join(','), cropList.join(','), year]);
useEffect(() => {
if (!crop || !varietyList.some(v => (typeof v === 'string' ? v : v.name) === variety) && variety !== 'ALL') { setVariety(""); setPurpose(""); setSeason(""); }
}, [crop, varietyList.map(v => typeof v === 'string' ? v : `${v.name}_${v.year}`).join(','), variety]);
useEffect(() => {
if (!purposeList.includes(purpose) && purpose !== 'ALL') { setPurpose(""); setSeason(""); }
}, [variety, purposeList.join(',')]);
useEffect(() => {
if (!seasonList.includes(season)) setSeason("");
}, [purpose, seasonList.join(',')]);
if (!isOpen) return null;
const generateSheetData = (data, context) => {
const { grid, config } = data;
if(!grid || !config) return null;
const plantIds = Object.keys(grid);
const allChars = getAllCharacteristics(config);
const titleRow = [`Phenomics Data: ${context.crop} - ${context.variety} (${context.purpose || 'N/A'})`];
const headers = ["Characteristics", ...plantIds.map(id => grid[id].label)];
const sheetData = [titleRow, [], headers];
allChars.forEach((char, idx) => {

sheetData.push(row);
});
return sheetData;
};
const handleDownload = async () => {
if (!station) { alert("Please select a station."); return; }
const downloadCsvFallback = () => {
if (!station || !year || !crop || !variety || !purpose || !season) {
alert("Please select Station, Year, Crop, Variety, Purpose, and Season.");
return;
}
const selectedStationList = station === 'ALL' ? stationList : [station];
const selectedCropList = crop === 'ALL' ? cropList : [crop];
const selectedVarietyList = variety === 'ALL'
? varietyList
: varietyList.filter(v => (typeof v === 'string' ? v === variety : v.name === variety));
const csvSections = [];
const escapeCsv = value => `"${String(value ?? '').replace(/"/g, '""')}"`;
selectedStationList.forEach(selectedStation => {
selectedCropList.forEach(selectedCrop => {
selectedVarietyList
.filter(v => (year === 'ALL' || typeof v === 'string' || String(v.year) === String(year)) && (purpose === 'ALL' || typeof v === 'string' || v.purpose === purpose) && (season === 'ALL' || typeof v === 'string' || v.season === season))
.forEach(vObj => {
const normalizedVariety = typeof vObj === 'string' ? { name: vObj, year: 2024, purpose: 'Phenomics', season: 'Rabi' } : vObj;
const key = `phenomics_${selectedStation}_${selectedCrop}_${normalizedVariety.name}_${normalizedVariety.purpose}_${normalizedVariety.year}_${normalizedVariety.season}`.replace(/\\s/g, "_");
const data = loadData(key);
if (!data?.grid) return;
const exportGrid = submittedOnly
? Object.fromEntries(Object.entries(data.grid).map(([plantId, plant]) => [plantId, { ...plant, cells: Object.fromEntries(Object.entries(plant.cells || {}).map(([idx, cell]) => [idx, cell?.status === 'submitted' ? cell : { ...cell, value: '' }])) }]).filter(([, plant]) => Object.values(plant.cells || {}).some(cell => cell?.status === 'submitted')))
: data.grid;
const sheetData = generateSheetData({ ...data, grid: exportGrid, config: loadConfig(selectedStation, selectedCrop) }, { station: selectedStation, crop: selectedCrop, variety: normalizedVariety.name, purpose: normalizedVariety.purpose, year: normalizedVariety.year, season: normalizedVariety.season });
if (sheetData) csvSections.push(sheetData.map(row => row.map(escapeCsv).join(',')).join('\n'));
});
});
});
if (csvSections.length === 0) { alert("No data found for the selected criteria."); return; }
const blob = new Blob([csvSections.join('\n\n')], { type: 'text/csv;charset=utf-8;' });
const link = document.createElement('a');

}]).filter(([, plant]) => Object.values(plant.cells || {}).some(cell => cell?.status === 'submitted')))
: data.grid;
const cfg = loadConfig(s, c);
const ctx = {station: s, crop: c, variety: vObj.name, purpose: vObj.purpose, year: vObj.year, season: vObj.season};
const sheetData = generateSheetData({...data, grid: exportGrid, config: cfg}, ctx);
if(sheetData) {

const sheetName = `${vObj.name.substring(0,15)}_${vObj.year}_${vObj.season.substring(0,4)}`.replace(/[\\?*[\]/]/g, '');
window.XLSX.utils.book_append_sheet(wb, ws, sheetName);
sheetsAdded++;
}
}
};
if (!station || !year || !crop || !variety || !purpose || !season) { alert("Please select Station, Year, Crop, Variety, Purpose, and Season."); return; }
const selectedStationList = station === 'ALL' ? stationList : [station];
const selectedCropList = crop === 'ALL' ? cropList : [crop];
const selectedVarietyList = variety === 'ALL' ? varietyList : varietyList.filter(v => (typeof v === 'string' ? v === variety : v.name === variety));
selectedStationList.forEach(selectedStation => {
selectedCropList.forEach(selectedCrop => {
selectedVarietyList.filter(v => (year === 'ALL' || typeof v === 'string' || String(v.year) === String(year)) && (purpose === 'ALL' || typeof v === 'string' || v.purpose === purpose) && (season === 'ALL' || typeof v === 'string' || v.season === season)).forEach(vObj => addSheet(selectedStation, selectedCrop, typeof vObj === 'string' ? { name: vObj, year: 2024, purpose: 'Phenomics', season: 'Rabi' } : vObj));
});
});
fileName = `Phenomics_${station}_${crop}_${variety}_${year}_${season}`;
if (sheetsAdded === 0) { alert("No data found for the selected criteria."); return; }
window.XLSX.writeFile(wb, `${fileName}.xlsx`);
onClose();
} catch (err) { console.error(err); alert("Export failed."); }
};
return (
<div className="fixed inset-0 z-[200] flex items-center justify-center p-4 modal-overlay bg-forest-950/60">

const loadFieldObservationReports = () => {

});
for (let i = 0; i < localStorage.length; i++) {
const key = localStorage.key(i);
if (!key || !key.startsWith('phenomics_examiner_report_') || key.startsWith('phenomics_examiner_report_submission_')) continue;
const report = loadData(key);
if (!report?.characteristics?.length) continue;
const storedSubmissionIds = new Set(reports.map(item => item.submissionId).filter(Boolean));
const submittedHistory = Array.isArray(report.submissionHistory) && report.submissionHistory.length > 0
? report.submissionHistory.filter(item => !item.submissionId || !storedSubmissionIds.has(item.submissionId))
: (report.reportStatus === 'submitted' && !report.submissionId ? [report] : []);
submittedHistory.forEach((submittedReport, index) => {
reports.push({ ...submittedReport, key: `${key}::submission-${index}`, sourceKey: key });
});
}
reports.sort((a, b) => new Date(b.submittedAt || 0) - new Date(a.submittedAt || 0));
const usedSerials = new Set(reports.map(report => parseInt(report.serialNumber, 10)).filter(Number.isFinite));
let nextSerial = Math.max(0, ...usedSerials) + 1;
let migrated = false;
reports.forEach(report => {
if (!Number.isFinite(parseInt(report.serialNumber, 10))) {
report.serialNumber = nextSerial++;
const sourceReport = loadData(report.sourceKey);
if (sourceReport) {
const historyIndex = reports.filter(item => item.sourceKey === report.sourceKey).indexOf(report);
if (Array.isArray(sourceReport.submissionHistory) && sourceReport.submissionHistory[historyIndex]) {
sourceReport.submissionHistory[historyIndex] = { ...sourceReport.submissionHistory[historyIndex], serialNumber: report.serialNumber };
}
localStorage.setItem(report.sourceKey, JSON.stringify(sourceReport));

}
});
if (migrated) localStorage.setItem("phenomics_field_observation_next_serial", String(nextSerial));
// Keep one Field Observations entry per variety/trial while grouping observations by submission date.
// Repeated submissions for the same characteristic on the same date share one submission.
const groupedReports = [];
const groupedReportMap = new Map();
reports.forEach(report => {
const variety = report.variety || {};
const groupKey = [
report.station || '',
report.crop || '',
variety.name || ''
].join('|');
if (!groupedReportMap.has(groupKey)) {
const group = { ...report, submissions: [] };
groupedReportMap.set(groupKey, group);
groupedReports.push(group);
}
const group = groupedReportMap.get(groupKey);
(report.characteristics || []).forEach(characteristic => {
if (characteristic.status !== 'submitted' || String(characteristic.value ?? '').trim() === '') return;
const isOneTimeObservation = characteristic.name === 'Date of Sowing' || characteristic.name === 'Germination';
const submittedAt = characteristic.submittedAt || report.submittedAt;
const dateKey = submittedAt ? new Date(submittedAt).toISOString().slice(0, 10) : 'unknown';
let submission = group.submissions.find(item => item.dateKey === dateKey);
if (!submission) {

...report,

submissionId: `${report.submissionId || report.key || report.submittedAt}-${dateKey}`,
submittedAt,
characteristics: []
};
group.submissions.push(submission);
}
const existingObservation = submission.characteristics.find(item => item.name === characteristic.name);
if (existingObservation) {
if (!isOneTimeObservation) existingObservation.observations.push(characteristic);
} else {
submission.characteristics.push({ ...characteristic, observations: [characteristic] });
}
});
});
groupedReports.forEach(group => {
group.submissions.sort((a, b) => new Date(a.submittedAt || 0) - new Date(b.submittedAt || 0));
group.submissions = group.submissions.map((submission, index) => {

<div className="text-xs font-bold pt-1 pr-5">{plant.label}</div>

</thead>

</div>
</div>
</>

{view === 'history' && context.variety && (

</div>
{context.returnComment && (<div className="mb-4 p-3 rounded-lg bg-amber-50 border border-amber-200 text-sm text-amber-800"><strong>Required amendments:</strong> {context.returnComment}<span className="block text-xs mt-1 text-amber-600">Returned by {context.returnedBy || 'Reviewer'}{context.returnedAt ? ` on ${new Date(context.returnedAt).toLocaleString()}` : ''}</span></div>)}

<tr>
<th className="p-2.5 border sticky left-0 top-0 z-50 bg-forest-800 text-white min-w-[120px] font-bold">Characteristics</th>

{config.groups.map((group, gIdx) => {

const isCollapsed = collapsedGroups[group.name] !== false;
const visibleCharacteristics = group.characteristics.map((char, cIdx) => ({ char, cIdx, globalCharIdx: offset + cIdx })).filter(({ globalCharIdx }) => visiblePlantIds.some(plantId => {
const cell = grid[plantId].cells[globalCharIdx];

if (visibleCharacteristics.length === 0) return null;
return (
<React.Fragment key={gIdx}>

<button type="button" onClick={() => setCollapsedGroups(previous => ({ ...previous, [group.name]: !isCollapsed }))} className="w-full flex items-center gap-2 px-2 py-2 text-left hover:bg-forest-200 transition" aria-expanded={!isCollapsed}>
<span className="text-sm leading-none">{isCollapsed ? '▸' : '▾'}</span>
<span className="whitespace-nowrap">{group.name}</span>
</button>
</th><th colSpan={visiblePlantIds.length} className="bg-forest-50 border-b border-sand-200"></th></tr>
{!isCollapsed && visibleCharacteristics.map(({ char, cIdx, globalCharIdx }) => {
return (
<tr key={`hist-char-${gIdx}-${cIdx}`} className="hover:bg-sand-50/50 transition">
<th className="border p-0 sticky left-0 z-20 bg-forest-800 text-white text-xs text-left"><div className="px-3 py-2 font-semibold">{char.name}</div></th>

return (
<td key={plantId} className={`border p-2 align-top ${colors.body} ${!isSubmitted ? 'opacity-50' : ''}`}>

<div className="mt-1 pt-1 border-t border-sand-200 space-y-1">
{cell.comment && (<div className="bg-white/70 p-1 rounded text-left"><span className="text-[8px] font-bold text-forest-700 block uppercase tracking-wide">Comment</span><p className="text-[9px] text-forest-600 whitespace-pre-wrap break-words">{cell.comment}</p></div>)}
{cell.image && (<div className="bg-white/70 p-1 rounded text-left"><span className="text-[8px] font-bold text-forest-700 block uppercase tracking-wide">Photo Evidence</span><a href={cell.image} target="_blank" rel="noopener noreferrer"><img src={cell.image} alt="Evidence" className="h-12 w-auto rounded mt-0.5 object-cover cursor-pointer hover:opacity-80 transition" /></a></div>)}
<div className="text-[9px] text-forest-700 font-bold">By: {cell.author}</div>
<div className="text-[9px] text-forest-500">{new Date(cell.timestamp).toLocaleString()}</div>
{session.context.gps && (<div className="text-[8px] text-blue-600 mt-1 flex items-center gap-1"><svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" strokeWidth="1.5"/><path strokeLinecap="round" strokeWidth="1.5" d="M12 2v4m0 12v4M2 12h4m12 0h4"/></svg>{session.context.gps.lat.toFixed(4)}, {session.context.gps.lng.toFixed(4)}</div>)}
</div>
) : (!isSessionReadOnly && <div className="mt-1 pt-1 border-t border-sand-200"><div className="text-[9px] text-amber-600 font-bold">Pending</div></div>)}
</td>
);
})}
</tr>
);
})}
</React.Fragment>
);
})}
</tbody>
</table>
</div>
</div>
)}
</main>
<DetailModal isOpen={modalState.isOpen} onClose={() => setModalState({ isOpen: false, plantId: null, charIdx: null })} onSave={handleModalSave} cellData={currentCellData} charName={currentChar.name} options={currentChar.options} colLabel={currentPlantLabel} readOnly={view === 'history' || (currentCellData.status === 'submitted' && !canEditReturnedSession) || isSessionReadOnly} />
<ReturnDataModal isOpen={returnModalOpen} onClose={() => setReturnModalOpen(false)} onConfirm={handleReturnSubmittedData} context={context} />
<ExportModal isOpen={exportModalOpen} onClose={() => setExportModalOpen(false)} defaultContext={session ? session.context : selection} masterStations={masterData.stations} submittedOnly={true} />
</div>
);

return (

<option value="examiner">Examiner</option>

<button type="submit" className="bg-forest-700 text-white py-3 rounded-lg font-bold hover:bg-forest-800 transition btn-press shadow-md shadow-forest-900/20">Add New User</button>
</form>

<div className="mb-4 relative w-full max-w-xl">
<svg className="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-forest-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">

<input
value={userSearch}
onChange={(e) => setUserSearch(e.target.value)}

/>

<div className="flex flex-wrap gap-2 mb-4 border-b border-sand-200">
{[

{tab.label}

<span className="text-sm text-forest-800">{s}</span>

</div>

<div className="p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">

</tr>
))}
</React.Fragment>
);
})}
</tbody>
</table>
</div>
</div>
)}
</div>
)}
{false && (
<div className="space-y-6">
<div className="bg-gradient-to-br from-forest-50 to-sand-50 p-4 rounded-xl border border-forest-200"><h3 className="font-display font-bold text-lg text-forest-900">Quantitative Phenomics Trait Analysis</h3><p className="text-xs text-forest-600 mt-1">{v2vAnalysisData.crop} · All registered stations with submitted quantitative observations · Replications and varieties analyzed separately and jointly.</p></div>
{v2vAnalysisData.traits.map(trait => <div key={trait.name} className="space-y-4"><div className="p-3 bg-forest-700 text-white rounded-xl font-bold">Trait: {trait.name}</div>{trait.includeReplications && v2vAnalysisData.stations.map(station => <div key={`${trait.name}-${station}-rep`} className="space-y-3"><h4 className="font-display font-bold text-forest-900">{station}</h4>{renderAnalysisSummary('Variation among Replications within Station', trait.stationAnalyses[station].replication)}</div>)}{trait.includeStationVarieties && v2vAnalysisData.stations.map(station => <div key={`${trait.name}-${station}-var`} className="space-y-3"><h4 className="font-display font-bold text-forest-900">{station}</h4>{renderAnalysisSummary('Variation among Varieties within Station', trait.stationAnalyses[station].variety)}</div>)}{trait.includeReplications && renderAnalysisSummary('Variation among Replications across All Stations', trait.acrossReplications)}{trait.includeCombined && renderAnalysisSummary('Combined Variation among Varieties across Stations', trait.combined)}</div>)}
</div>
)}
</>
)}
{!analyticsData && statsSubTab !== 'variety' && (
<div className="analytics-empty rounded-2xl p-8 md:p-12 text-center">
<div className="max-w-2xl mx-auto">
<div className="analytics-orbit"><Icons.Chart /></div>
<h3 className="text-2xl font-display font-bold text-forest-900 mb-2">Ready to explore your agricultural data?</h3>
<p className="text-forest-500 text-sm md:text-base leading-relaxed">Select a Station, Crop, and Variety from the filters above, then analyze the data to discover patterns, compare varieties, and evaluate crop performance.</p>
<div className="analytics-features">
<div className="analytics-feature"><b>01 · Explore</b><p className="text-xs text-forest-600 mt-2">View detailed statistical information.</p></div>
<div className="analytics-feature"><b>02 · Compare</b><p className="text-xs text-forest-600 mt-2">Compare varieties, crops, and stations.</p></div>
<div className="analytics-feature"><b>03 · Decide</b><p className="text-xs text-forest-600 mt-2">Use evidence to support breeding and research decisions.</p></div>
</div>
</div>
</div>
)}
</div>
)}
</div>
)}
{!isAdmin && !isFscrd && activeTab === 'examiner_report' && (
<div className="max-w-5xl mx-auto space-y-6">
<div className="bg-white rounded-xl shadow-sm p-6 border border-sand-200">
<h2 className="font-display text-2xl font-bold text-forest-900">Field Observations</h2>
<p className="text-sm text-forest-600 mt-1">Select a trial, review the observation fields, and submit your observations.</p>
<div className="grid grid-cols-1 md:grid-cols-3 gap-4 mt-6">
<select value={examinerReportStation} onChange={(e) => { setExaminerReportStation(e.target.value); setExaminerReportCrop(""); setExaminerReportVariety(""); setExaminerReportData(null); }} className="p-3 border border-sand-200 rounded-lg bg-white text-forest-900"><option value="">Select Station</option>{getSortedStationNames(masterData.stations).map(s => <option key={s} value={s}>{formatStationName(s)}</option>)}</select>
<select value={examinerReportCrop} onChange={(e) => { setExaminerReportCrop(e.target.value); setExaminerReportVariety(""); setExaminerReportData(null); }} disabled={!examinerReportStation} className="p-3 border border-sand-200 rounded-lg bg-white text-forest-900 disabled:bg-sand-100"><option value="">Select Crop</option>{examinerReportStation && Object.keys(masterData.stations[examinerReportStation].crops).map(c => <option key={c} value={c}>{c}</option>)}</select>
<select value={examinerReportVariety} onChange={(e) => { setExaminerReportVariety(e.target.value); setExaminerReportData(null); }} disabled={!examinerReportCrop} className="p-3 border border-sand-200 rounded-lg bg-white text-forest-900 disabled:bg-sand-100"><option value="">Select Variety</option>{examinerReportCrop && masterData.stations[examinerReportStation].crops[examinerReportCrop].map((v, idx) => <option key={idx} value={v.name}>{v.name} ({v.year} - {v.season} - {v.purpose})</option>)}</select>
</div>
<button onClick={handleLoadExaminerReport} disabled={!examinerReportVariety} className="mt-4 bg-forest-700 text-white px-6 py-2.5 rounded-lg font-bold hover:bg-forest-800 transition disabled:opacity-50 disabled:cursor-not-allowed">Load Trial Observations</button>
</div>
{examinerReportData && <div className="bg-white rounded-xl shadow-sm border border-sand-200 overflow-hidden"><div className="p-4 bg-forest-50 border-b border-sand-200"><h3 className="font-bold text-forest-900">{examinerReportData.variety.name}</h3><p className="text-xs text-forest-600">{examinerReportData.station} · {examinerReportData.crop} · {examinerReportData.variety.year} · {examinerReportData.variety.season}</p></div><div className="p-4 space-y-4">{examinerReportData.characteristics.map((char, idx) => <div key={idx} className="rounded-xl border border-sand-200 p-4 bg-sand-50"><label className="block text-sm font-bold text-forest-800 mb-2">{char.name}</label>{char.name === "Germination" ? (<select value={char.value} disabled={char.status === "submitted"} onChange={(e) => setExaminerReportData(prev => ({ ...prev, characteristics: prev.characteristics.map((item, i) => i === idx ? { ...item, value: e.target.value, status: "draft" } : item) }))} className="w-full p-3 border border-sand-200 rounded-lg text-forest-900 bg-white disabled:bg-sand-100 disabled:cursor-not-allowed"><option value="">Select germination level</option>{char.options.map(option => <option key={option} value={option}>{option}</option>)}</select>) : char.name === "Date of Sowing" ? (<input type="date" value={char.value} disabled={char.status === "submitted"} onChange={(e) => setExaminerReportData(prev => ({ ...prev, characteristics: prev.characteristics.map((item, i) => i === idx ? { ...item, value: e.target.value, status: "draft" } : item) }))} className="w-full p-3 border border-sand-200 rounded-lg text-forest-900 bg-white disabled:bg-sand-100 disabled:cursor-not-allowed" />) : (<textarea value={char.value} onChange={(e) => setExaminerReportData(prev => ({ ...prev, characteristics: prev.characteristics.map((item, i) => i === idx ? { ...item, value: e.target.value, status: "draft" } : item) }))} className="w-full p-3 border border-sand-200 rounded-lg text-forest-900 bg-white" rows="3" placeholder={`Enter ${char.name.toLowerCase()} observation`} />)}{char.name === "Germination" && (<><label className="block text-sm font-bold text-forest-800 mt-3 mb-2">Remarks</label><textarea value={char.remarks || ""} disabled={char.status === "submitted"} onChange={(e) => setExaminerReportData(prev => ({ ...prev, characteristics: prev.characteristics.map((item, i) => i === idx ? { ...item, remarks: e.target.value, status: "draft" } : item) }))} className="w-full p-3 border border-sand-200 rounded-lg text-forest-900 bg-white disabled:bg-sand-100 disabled:cursor-not-allowed" rows="3" placeholder="Enter remarks" /></>)}<div className="flex justify-end gap-2 mt-3"><button onClick={() => handleSaveExaminerObservationDraft(idx)} disabled={char.name === "Date of Sowing" || char.name === "Germination" ? char.status === "submitted" : false} className="px-4 py-2 bg-white text-amber-700 border border-amber-300 rounded-lg font-bold hover:bg-amber-50 transition disabled:opacity-50 disabled:cursor-not-allowed">Save as Draft</button><button onClick={() => handleSubmitExaminerObservation(idx)} disabled={char.name === "Date of Sowing" || char.name === "Germination" ? char.status === "submitted" : false} className="px-4 py-2 bg-forest-700 text-white rounded-lg font-bold hover:bg-forest-800 transition disabled:opacity-50 disabled:cursor-not-allowed">Submit</button></div></div>)}</div></div>}
<SubmittedObservationRecord report={examinerReportData} />
</div>
)}
{activeTab === 'conversation' && (
<div className="max-w-4xl mx-auto h-[calc(100vh-8rem)] flex flex-col bg-white rounded-xl shadow-sm border border-sand-200 overflow-hidden">
<div className="p-4 bg-forest-50 border-b border-sand-200">
<div className="flex justify-between items-center gap-3 flex-wrap">
<h2 className="font-display font-bold text-lg text-forest-900 flex items-center gap-2"><Icons.Chat /> Team Conversation</h2>
<span className="text-xs text-forest-600 bg-white px-3 py-1 rounded-full border border-forest-100">{visibleMessages.length} messages</span>
</div>
<div className="mt-3 flex flex-wrap items-center gap-2">
<label className="text-xs font-bold text-forest-600 uppercase" htmlFor="conversation-date">Date</label>
<input id="conversation-date" type="date" value={conversationDate} onChange={(e) => setConversationDate(e.target.value)} className="p-2 border border-sand-200 rounded-lg bg-white text-forest-900 text-xs" />
<label className="text-xs font-bold text-forest-600 uppercase ml-1" htmlFor="conversation-sender">Sender</label>
<select id="conversation-sender" value={conversationSender} onChange={(e) => setConversationSender(e.target.value)} className="p-2 border border-sand-200 rounded-lg bg-white text-forest-900 text-xs">
<option value="">All senders</option>
{conversationSenders.map(([id, name]) => <option key={id} value={id}>{name}</option>)}
</select>
<select value={conversationSort} onChange={(e) => setConversationSort(e.target.value)} aria-label="Sort conversations by date" className="p-2 border border-sand-200 rounded-lg bg-white text-forest-900 text-xs">
<option value="newest">Newest first</option>
<option value="oldest">Oldest first</option>
</select>
{(conversationDate || conversationSender) && <button onClick={() => { setConversationDate(""); setConversationSender(""); }} className="px-2.5 py-2 text-xs font-semibold text-forest-700 border border-forest-200 rounded-lg hover:bg-white">Clear filters</button>}
</div>
</div>
<div className="flex-1 overflow-y-auto p-4 space-y-4 bg-sand-50/30">
{messages.length === 0 ? (
<div className="text-center text-forest-400 py-10 flex flex-col items-center"><Icons.Chat /><p className="mt-2">No messages yet. Start the conversation!</p></div>
) : (
visibleMessages.map((msg, idx) => {
const isSelf = msg.senderId === loggedInUser.id;
const showName = idx === 0 || visibleMessages[idx-1].senderId !== msg.senderId;
return (
<div key={msg.id} className={`flex ${isSelf ? 'justify-end' : 'justify-start'}`}>
<div className={`max-w-[85%] md:max-w-[60%] ${isSelf ? 'items-end' : 'items-start'} flex flex-col`}>
{showName && !isSelf && (<span className="text-xs font-bold text-forest-600 mb-1 ml-1">{msg.senderName}</span>)}
<div className={`p-3 rounded-2xl shadow-sm ${isSelf ? 'bg-forest-600 text-white rounded-br-none' : 'bg-white text-forest-900 border border-sand-200 rounded-bl-none'}`}>
<div className={`mb-1 text-[10px] font-bold ${isSelf ? 'text-forest-100' : 'text-forest-500'}`}>Conversation #{msg.serialNumber || '—'}</div>
{msg.text && <p className="text-sm whitespace-pre-wrap">{msg.text}</p>}
{msg.attachment && (<a href={msg.attachment.data} download={msg.attachment.name} className={`mt-2 flex items-center gap-2 p-2 rounded-lg text-xs font-medium ${isSelf ? 'bg-forest-700 hover:bg-forest-800 text-white' : 'bg-sand-100 hover:bg-sand-200 text-forest-800'} transition`}><Icons.Paperclip /><span className="truncate max-w-[150px]">{msg.attachment.name} ({(msg.attachment.size / 1024).toFixed(1)} KB)</span></a>)}
</div>
<span className="text-[10px] text-forest-400 mt-1 mx-1">{new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
</div>
</div>
);
})
)}
</div>
<div className="p-4 bg-white border-t border-sand-200">
{(role === 'deputy_director' || role === 'registrar') && (
<div className="mb-3">
<label className="block text-xs font-bold text-forest-500 uppercase mb-1">Select Recipient</label>
<details className="w-full border border-sand-200 rounded-lg bg-sand-50 text-forest-900">
<summary className="cursor-pointer p-2.5 text-sm font-medium">{messageRecipient.length ? `${messageRecipient.length} recipient${messageRecipient.length === 1 ? '' : 's'} selected` : 'Select usernames'}</summary>
<div className="p-2 border-t border-sand-200 max-h-48 overflow-y-auto space-y-1">
{[...masterData.users]
.sort((a, b) => String(a.username || '').localeCompare(String(b.username || ''), undefined, { sensitivity: 'base' }))
.map(user => (
<label key={user.id} className="flex items-center gap-2 p-2 rounded-lg hover:bg-white cursor-pointer">
<input
type="checkbox"
checked={messageRecipient.includes(String(user.id))}
onChange={(e) => setMessageRecipient(prev => e.target.checked ? [...prev, String(user.id)] : prev.filter(id => id !== String(user.id)))}
className="w-4 h-4 text-forest-600 rounded focus:ring-forest-500"
/>
<span className="text-sm">{user.username} <span className="text-xs text-forest-500">({user.role === 'deputy_director_fscrd' ? 'Deputy Director (FSC&RD)' : user.role.replace(/_/g, ' ')})</span></span>
</label>
))}
</div>
</details>
<p className="text-xs text-forest-500 mt-1">Leave all unchecked to message Registrar & Deputy Director.</p>
</div>
)}
{selectedFile && (<div className="mb-2 flex items-center gap-2 text-xs text-forest-700 bg-forest-50 p-2 rounded-lg border border-forest-100"><Icons.Paperclip /><span className="truncate flex-1">{selectedFile.name} ({(selectedFile.size / 1024).toFixed(1)} KB)</span><button onClick={() => { setSelectedFile(null); if(fileInputRef.current) fileInputRef.current.value = ""; }} className="text-red-500 hover:text-red-700 font-bold px-1">&times;</button></div>)}
<div className="flex gap-2 items-end">
<input type="file" ref={fileInputRef} className="hidden" onChange={(e) => setSelectedFile(e.target.files[0])} />
<button onClick={() => fileInputRef.current?.click()} className="p-3 text-forest-500 hover:text-forest-700 hover:bg-forest-50 rounded-xl transition btn-press" title="Attach File (Max 1MB)"><Icons.Paperclip /></button>
<textarea value={newMessageText} onChange={(e) => setNewMessageText(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSendMessage(); } }} placeholder="Type a message..." className="flex-1 p-3 border border-sand-200 rounded-xl bg-sand-50 text-forest-900 focus:border-forest-400 focus:bg-white resize-none max-h-32 min-h-[48px]" rows={1} />
<button onClick={handleSendMessage} disabled={!newMessageText.trim() && !selectedFile} className="p-3 bg-forest-700 text-white rounded-xl hover:bg-forest-800 disabled:opacity-50 disabled:cursor-not-allowed transition btn-press shadow-md shadow-forest-900/20">
<svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
</button>
</div>
</div>
</div>
)}
{!isAdmin && !isFscrd && activeTab === 'entry' && (
<div className="max-w-2xl mx-auto space-y-6">
<div className="bg-white rounded-xl shadow-sm p-6 border border-sand-200">
<h3 className="font-display font-bold text-lg mb-4 text-forest-900">New Trial Entry</h3>
<div className="space-y-4">
<div><label className="text-xs font-bold text-forest-500 uppercase">1. Station</label><select value={selection.station} onChange={(e) => handleSelectChange("station", e.target.value)} className="mt-1 w-full border border-sand-200 p-3 rounded-lg bg-white text-forest-900 focus:border-forest-400"><option value="">-- Select Station --</option>{getSortedStationNames(masterData.stations).map(s => <option key={s} value={s}>{s}</option>)}</select></div>
<div><label className="text-xs font-bold text-forest-500 uppercase">2. Crop</label><select value={selection.crop} onChange={(e) => handleSelectChange("crop", e.target.value)} disabled={!selection.station} className="mt-1 w-full border border-sand-200 p-3 rounded-lg bg-white text-forest-900 disabled:bg-sand-100 focus:border-forest-400"><option value="">-- Select Crop --</option>{cropList.map(c => <option key={c} value={c}>{c}</option>)}</select></div>
<div><label className="text-xs font-bold text-forest-500 uppercase">3. Variety</label>
<select value={selection.variety ? `${selection.variety}_${selection.year}_${selection.season}_${selection.purpose}` : ""} onChange={(e) => handleSelectChange("variety", e.target.value)} disabled={!selection.crop} className="mt-1 w-full border border-sand-200 p-3 rounded-lg bg-white text-forest-900 disabled:bg-sand-100 focus:border-forest-400">
<option value="">-- Select Variety --</option>
{varietyList.map((v, idx) => { const val = `${v.name}_${v.year}_${v.season}_${v.purpose}`; return <option key={idx} value={val}>{v.name} ({v.year} - {v.season} - {v.purpose})</option> })}
</select>
</div>
<button onClick={handleOpenSheetClick} disabled={!selection.variety} className="w-full bg-forest-700 text-white py-3 rounded-lg font-bold hover:bg-forest-800 disabled:opacity-50 disabled:cursor-not-allowed transition btn-press shadow-md shadow-forest-900/20">Start Data Recording</button>
</div>
</div>
</div>
)}
</main>
</div>
<ProfileModal isOpen={profileOpen} onClose={() => setProfileOpen(false)} user={loggedInUser} onUpdateProfile={handleUpdateProfile} />
<UserEditModal isOpen={!!editingUser} onClose={() => setEditingUser(null)} user={editingUser} onSave={handleSaveUser} onSetPassword={handleSetUserPassword} />
<VarietyEditModal isOpen={!!editingVariety} onClose={() => setEditingVariety(null)} variety={editingVariety} onSave={handleSaveVariety} />
<GpsPromptModal isOpen={gpsModalOpen} onClose={() => setGpsModalOpen(false)} onCaptured={handleGpsCaptured} />
<ExportModal isOpen={exportModalOpen} onClose={() => setExportModalOpen(false)} defaultContext={selection} masterStations={masterData.stations} />
</div>
);
}
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<PhenomicsApp />);
</script>
</body>
</html>
